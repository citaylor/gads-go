# Dependabot version updates: a weekly PR for each group of updates. The
# security updates (on in the repository settings) come as soon as an
# advisory is published, whatever this file says.
#
# - gads-go/THIRD-PARTY-LICENSES lists no versions, so a Go module update
#   passes CI's licence check unless it changes a licence or adds or
#   removes a module: then run `./third-party-licenses.sh` (from gads-go/)
#   on the branch, and update NOTICE for a new module.
# - The Dockerfiles build their base image tags from ARGs, which
#   Dependabot cannot read; GO_VERSION (Dockerfile, ci.yml) and the Perl
#   reference image are updated by hand. The Perl image must stay the one
#   the golden results come from.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /gads-go
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "Go modules"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # caddy and postgres in the compose files
  - package-ecosystem: docker-compose
    directories: [/gads-go, /conformance]
    schedule:
      interval: weekly
    ignore:
      # A new major PostgreSQL needs its data directory upgraded (pg_upgrade
      # or a dump and restore): change it by hand.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "Docker"
