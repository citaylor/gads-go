# Dependabot version updates: a weekly PR for each group of updates. The
# security updates (on in the repository settings) come as soon as an
# advisory is published, whatever this file says.
#
# - gads-go/THIRD-PARTY-LICENSES lists no versions, so a Go module update
#   passes CI's licence check unless it changes a licence or adds or
#   removes a module: then run `./third-party-licenses.sh` (from gads-go/)
#   on the branch, and update NOTICE for a new module.
# - The base images of gads-go/Dockerfile are pinned by digest, which
#   Dependabot updates (Go patch releases only: change GO_VERSION in ci.yml
#   to match). The Perl reference image (conformance/docker/perl) is left
#   out: it must stay the one the golden results come from.
# - The workflows pin actions to commits, with the version in a comment;
#   Dependabot updates both.
# - A release is proposed only once it is 7 days old (cooldown), so that a
#   compromised release is likely found and pulled first. Security updates
#   are not delayed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /gads-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "Go modules"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # caddy and postgres in the compose files
  - package-ecosystem: docker-compose
    directories: [/gads-go, /conformance]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new major PostgreSQL needs its data directory upgraded (pg_upgrade
      # or a dump and restore): change it by hand.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "Docker"

  # golang and debian in gads-go/Dockerfile
  - package-ecosystem: docker
    directory: /gads-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # A new Go minor is a change of go.mod and CI too: by hand
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: "Docker"
