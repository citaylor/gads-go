# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, CI tests, fuzzing,
# security policy, ...). Its findings go to the Security tab, and the score
# is published at https://scorecard.dev/viewer/?uri=github.com/citaylor/gads-go.
# scorecard-action verifies this workflow before publishing, so it holds
# only approved actions, with no top-level env or defaults.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the SARIF
      id-token: write         # publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
