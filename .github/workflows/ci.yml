# The checks of CLAUDE.md "Build and test", on every push and pull request,
# and weekly for newly published vulnerabilities
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: gads-go

env:
  GO_VERSION: "1.27.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The submodules are the Perl GADS, whose views the web tests render
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gads-go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: Build with the pure Go SQLite driver
        run: go build -tags modernc ./...
      - name: Tests, Perl parity and the hardened scenarios
        run: go test ./...
      - name: Race detector
        run: go test -race ./internal/web ./internal/db ./cmd/gads

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gads-go/go.sum
      - name: Install the linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - run: staticcheck ./...
      - run: govulncheck ./...
      # goLuaCallback is a cgo export, which deadcode cannot see called
      - name: deadcode
        run: |
          out=$(deadcode -test ./... | grep -v 'unreachable func: goLuaCallback$' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gads_test
          POSTGRES_PASSWORD: gads_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gads_test -d postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      GADS_TEST_PG: host=localhost port=5432 user=gads_test
      PGPASSWORD: gads_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gads-go/go.sum
      # SQLite ignores column sizes and other constraints that PostgreSQL
      # enforces
      - name: Hardened scenarios on PostgreSQL
        run: go test ./conformance -run TestHardened
      - name: Reconnecting after PostgreSQL drops the connection
        run: go test ./internal/db -run TestReconnect

  # gosec (Go security patterns), gitleaks (secrets in the whole history)
  # and Trivy (vulnerabilities in the built image, and the Docker files).
  # The binaries are pinned releases checked against their SHA-256 (not the
  # actions: trivy-action's tags were replaced with malicious code in March
  # 2026). gosec and Trivy results also go to the Security tab.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GOSEC_VERSION: v2.30.0  # the first release that reads Go 1.27 packages
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRIVY_VERSION: 0.76.0
      TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
    steps:
      # The whole history for gitleaks, and GADS-dev for the image's views
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gads-go/go.sum
      - name: Install gosec, gitleaks and Trivy
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@$GOSEC_VERSION
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C bin gitleaks
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C bin trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # G104 (unchecked errors) is left out: the ignored errors are those
      # Perl ignores (Close, response writes, try {}). The conformance runner
      # and the benchmark tools read the files they are given. Each other
      # exception is a #nosec comment with its reason.
      - name: gosec
        run: >-
          gosec -exclude=G104 -exclude-generated
          -exclude-dir=conformance -exclude-dir=cmd/gads-bench
          -exclude-dir=cmd/gads-conformance -exclude-dir=cmd/gads-compare
          -fmt=sarif -out=gosec.sarif -stdout -verbose=text ./...
      - name: gitleaks
        working-directory: .
        run: gitleaks git --no-banner --redact -v .
      - name: Build the image
        run: docker build -t gads-go:ci --build-context gads-upstream=../upstream/GADS-dev .
      - name: Trivy
        run: |
          trivy image -q --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --format sarif -o trivy-image.sarif gads-go:ci
          trivy config -q --severity HIGH,CRITICAL --format sarif -o trivy-config.sarif .
          trivy image -q --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gads-go:ci
          trivy config -q --severity HIGH,CRITICAL --exit-code 1 .
      # Only for main, the branch the Security tab follows (a pull request
      # from a fork may not write alerts, and a short-lived branch may be
      # gone by the time of the upload)
      - name: Upload gosec results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('gads-go/gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gads-go/gosec.sarif
          category: gosec
      - name: Upload Trivy results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('gads-go/trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gads-go/trivy-image.sarif
          category: trivy-image
      - name: Upload Trivy configuration results
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('gads-go/trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gads-go/trivy-config.sarif
          category: trivy-config
