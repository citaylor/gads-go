# A disposable PostgreSQL server for running the conformance scenarios on
# PostgreSQL (the --pg option of run_perl.sh, run_go.sh and run_all.sh).
# Each runner creates and drops its own database per scenario, so the
# role is a superuser. The data is in memory and not durable: it is lost
# when the container stops.
#
#   docker compose -f docker-compose.test-pg.yml up -d --wait
#   docker compose -f docker-compose.test-pg.yml down
name: gads-test-pg

services:
  test-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gads_test
      POSTGRES_PASSWORD: gads_test
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      # Only reachable from this machine
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gads_test -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
