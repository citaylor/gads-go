# Dancer2 configuration used when the conformance runner loads the GADS web
# application in-process (see GADS::Conformance::Web)
appname: "Linkspace"
layout: "main"
charset: "UTF-8"
template: "template_toolkit"
logger: "LogReport"
session: "Simple"
show_errors: 0
engines:
  template:
    template_toolkit:
      RECURSION: 1
  logger:
    LogReport:
      app_name: GADS
      dispatchers:
        default:
          type: FILE
          mode: NORMAL
          to: /dev/null
gads:
  header: "HEADER"
  hostlocal: 1
  dateformat: "yyyy-MM-dd"
  email_from: '"Linkspace" <user@example.com>'
  aup: 0
  login_instance: 1
  default_instance: 1
  url: http://localhost/
  user_status: 0
plugins:
  LogReport:
    session_messages: [ NOTICE, MISTAKE, WARNING, ERROR, FAULT, ALERT, FAILURE, PANIC ]
  DBIC:
    default:
      dsn: "dbi:SQLite:dbname=:memory:"
      schema_class: GADS::Conformance::WebSchema
  Auth::Extensible:
    no_default_pages: 1
    no_login_handler: 1
    record_lastlogin: 1
    mailer:
      module: Mail::Message
      options:
        via: sendmail
    mail_from: '"Linkspace Database" <user@example.com>'
    password_reset_text: GADS::reset_text
    welcome_text: GADS::welcome_text
    realms:
      dbic:
        provider: DBIC
        user_as_object: 1
        users_resultset: User
        roles_resultset: Permission
        user_roles_resultset: UserPermission
        roles_role_column: name
        roles_key: permission
        password_expiry_days: 60
        users_pwchanged_column: pwchanged
        users_pwresetcode_column: resetpw
        encryption_algorithm: SHA-512
        user_valid_conditions:
          deleted: ~
          account_request: 0
