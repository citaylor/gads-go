name: h1_m5_get_credentials
hardened: 1
description: >
  H-1, M-5: /login and /mfa take credentials only in a POST. A GET can't
  write the failure count, and is not rate limited, so its guesses would
  have no lockout: hardened, a GET with a password or token is ignored.
steps:
  - sheet: { as: s, site_id: 1 }
  # A GET sign in: not tried (no login failure audited), not counted
  - http:
      id: get_signin
      path: "/login?signin=1&username=user4%40example.com&password=guess"
      no_body: true
      expect: { status: "200" }
  - db:
      id: get_signin_not_tried
      op: select
      table: audit
      where: { description: Login failure using username user4@example.com }
      columns: [type]
      expect: []
  - db:
      id: get_signin_failcount
      op: select
      table: user
      where: { username: user4@example.com }
      columns: [failcount]
      expect: [{ failcount: "0" }]
  # A POST sign in is tried and counted
  - http:
      id: post_signin_page
      path: /login
      no_body: true
  - http:
      id: post_signin
      method: POST
      path: /login
      form: { signin: 1, username: user4@example.com, password: guess }
      no_body: true
  - db:
      id: post_signin_tried
      op: select
      table: audit
      where: { description: Login failure using username user4@example.com }
      columns: [type]
      expect: [{ type: login_failure }]
  - db:
      id: post_signin_failcount
      op: select
      table: user
      where: { username: user4@example.com }
      columns: [failcount]
      expect: [{ failcount: "1" }]
  # A GET with an MFA token is not checked
  - login: { user: normal1 }
  - db: { op: update, table: user, where: { id: "@user:normal1" }, set: { mfa_type: otp, mfa_secret: JBSWY3DPEHPK3PXP } }
  - db: { op: update, table: site, where: { id: 1 }, set: { force_mfa: any } }
  # (in the body: the MFA hook sends /mfa?... to /mfa)
  - http:
      id: get_mfa_token
      as: normal1
      method: GET
      path: /mfa
      form: { token: "000000" }
      no_body: true
  - db:
      id: get_mfa_not_counted
      op: select
      table: user
      where: { id: "@user:normal1" }
      columns: [mfa_failcount]
      expect: [{ mfa_failcount: "0" }]
  - http:
      id: post_mfa_token
      as: normal1
      method: POST
      path: /mfa
      form: { token: "000000" }
      no_body: true
  - db:
      id: post_mfa_counted
      op: select
      table: user
      where: { id: "@user:normal1" }
      columns: [mfa_failcount]
      expect: [{ mfa_failcount: "1" }]
