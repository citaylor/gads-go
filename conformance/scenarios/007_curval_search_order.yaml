name: 007_curval_search_order
source:
- t/007_curval_search_order.t
description: Ordering by a curval while filtering on a curval sub-field that is not displayed
steps:
- sheet:
    as: cv
    instance_id: 2
    multivalue: 1
    data:
    - enum1:
      - 2
      - 3
      string1: apple4
    - enum1:
      - 1
      - 3
      string1: apple2
    - enum1:
      - 3
      string1: apple1
    - enum1:
      - 3
      - 1
      string1: apple3
- layout:
    op: position
    sheet: cv
    columns:
    - enum1
    - string1
- sheet:
    as: main
    curval: cv
    curval_fields:
    - string1
    data:
    - string1: pear1
      curval1: 2
    - string1: pear2
      curval1: 3
    - string1: pear3
      curval1: 2
    - string1: pear4
      curval1: 1
- layout:
    op: position
    sheet: main
    columns:
    - curval1
    - string1
- search:
    id: curval filter sorted
    sheet: main
    view:
      name: Curval search
      columns:
      - curval1
      - string1
      sorts:
      - name: curval1
        type: asc
    filter:
      rules:
      - name: curval1_enum1
        type: string
        value: foo1
        operator: equal
      - name: curval1_enum1
        type: string
        value: foo2
        operator: equal
      condition: OR
    observe:
    - curval1
    expect:
      count: '3'
      rows:
      - curval1: apple2
      - curval1: apple2
      - curval1: apple4
