- sheet:
    as: cv
    instance_id: 2
    data:
    - string1: Foo
      integer1: 50
      date1: '2014-10-10'
      daterange1:
      - '2012-02-10'
      - '2013-06-15'
      enum1: 1
    - string1: Bar
      integer1: 99
      date1: '2009-01-02'
      daterange1:
      - '2008-05-04'
      - '2008-07-14'
      enum1: 2
    - string1: Bar
      integer1: 99
      date1: '2009-01-02'
      daterange1:
      - '2008-05-04'
      - '2008-07-14'
      enum1: ''
    - string1: FooBar
      integer1: 150
      date1: '2000-01-02'
      daterange1:
      - '2001-05-12'
      - '2002-03-22'
      enum1: 3
- sheet:
    as: main
    data: &id002
    - string1: Foo
      integer1: '100'
      enum1:
      - 7
      - 8
      tree1: 10
      date1: '2010-10-10'
      daterange1:
      - '2000-10-10'
      - '2001-10-10'
      curval1: 1
      file1: null
    - string1: Bar
      integer1: '200'
      enum1: 8
      tree1: 11
      date1: '2011-10-10'
      daterange1:
      - '2000-11-11'
      - '2001-11-11'
      curval1: 2
      file1: null
    multivalue: 1
    curval: cv
    curval_fields:
    - string1
    calc_code: "function evaluate (L1string1)\n    if type(L1string1) == \"table\"\
      \ then\n        L1string1 = L1string1[1]\n    end\n    return L1string1\nend"
    calc_return_type: string
- column:
    op: update
    id: calc invalid character
    sheet: main
    column: calc1
    set:
      code: function evaluate (_id) return "test“test" end
    expect_error: .
- clear_layouts: {}
- held:
    op: find
    as: p
    sheet: cv
    current_id: 1
- held:
    op: delete
    as: p
- held:
