name: 001_lua_input_types
source:
- lib/GADS/Datum/*.pm
- lib/GADS/Column/Code.pm
description: Probe the exact Lua types/representations received by calc code for every datum type, via the database (update_cached) path and the record write path.
steps:
- sheet:
    as: curval
    instance_id: 2
- sheet:
    as: main
    instance_id: 1
    curval: curval
    curval_fields:
    - string1
    - integer1
    - date1
    data:
    - string1: Foo
      integer1: 50
      date1: '2014-10-10'
      daterange1:
      - '2012-02-10'
      - '2013-06-15'
      enum1: foo2
      tree1: tree3
      curval1: 1
      person1: 2
      file1: null
    - string1: ''
      integer1: null
- column:
    op: create
    sheet: main
    type: calc
    name: probe_string1
    name_short: probe_string1
    return_type: string
    code: |-
      function evaluate (L1string1)
          local function ser(v)
              if type(v) == "table" then
                  local keys = {}
                  for k in pairs(v) do table.insert(keys, k) end
                  table.sort(keys, function(a, b) return tostring(a) < tostring(b) end)
                  local out = {}
                  for _, k in ipairs(keys) do
                      table.insert(out, type(k):sub(1,1) .. tostring(k) .. "=" .. ser(v[k]))
                  end
                  return "{" .. table.concat(out, ",") .. "}"
              elseif type(v) == "number" then
                  return "n(" .. tostring(v) .. ")"
              elseif type(v) == "string" then
                  return "s(" .. v .. ")"
              else
                  return type(v) .. "(" .. tostring(v) .. ")"
              end
          end
          return ser(L1string1)
      end
