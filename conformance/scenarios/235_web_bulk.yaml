name: 235_web_bulk
source:
  - lib/GADS.pm (/:layout_name/bulk/:type/?)
  - lib/GADS/Role/Presentation/Record.pm (edit_columns bulk)
  - views/edit.tt
description: >
  Bulk updating and cloning records: the permission needed, an invalid
  type, the forms of each type (for the view and for selected records),
  values submitted but not ticked, updating all the records of the view,
  updating and cloning selected records, an invalid value (nothing
  updated) and no records to update.
steps:
  - sheet:
      as: s
      site_id: 1
      data:
        - { string1: Foo1, integer1: 1 }
        - { string1: Foo2, integer1: 2 }
        - { string1: Foo3, integer1: 3 }
  - login: { user: superadmin }
  - login: { user: normal1 }
  - http: { id: home_superadmin, as: superadmin, path: /, no_body: true }
  - http: { id: home_normal1, as: normal1, path: /, no_body: true }
  - http: { id: bulk_denied, as: normal1, path: "/{sheet:s}/bulk/update" }
  - db:
      op: insert
      table: instance_group
      set: { instance_id: 1, group_id: "@group:default", permission: bulk_update }
  - http: { id: bulk_update_page, as: superadmin, path: "/{sheet:s}/bulk/update" }
  - http: { id: bulk_clone_page, as: superadmin, path: "/{sheet:s}/bulk/clone/" }
  - http: { id: bulk_invalid_type, as: superadmin, path: "/{sheet:s}/bulk/delete" }
  - http: { id: bulk_update_selected_page, as: superadmin, path: "/{sheet:s}/bulk/update", query: { id: [1, 2] } }
  - http:
      id: bulk_update_all
      as: superadmin
      method: POST
      path: "/{sheet:s}/bulk/update"
      form:
        submit: 1
        "field{column:s:string1}": Bulk
        "bulk_inc_{column:s:string1}": 1
        "field{column:s:integer1}": 99
  - db:
      id: strings_after_all
      op: select
      table: string
      columns: [record_id, layout_id, value]
      order_by: [record_id, layout_id]
  - http:
      id: bulk_update_selected
      as: superadmin
      method: POST
      path: "/{sheet:s}/bulk/update"
      query: { id: [2] }
      form:
        submit: 1
        "field{column:s:integer1}": 50
        "bulk_inc_{column:s:integer1}": 1
  - http:
      id: bulk_clone_selected
      as: superadmin
      method: POST
      path: "/{sheet:s}/bulk/clone"
      query: { id: [1, 3] }
      form:
        submit: 1
        "field{column:s:string1}": Cloned
        "bulk_inc_{column:s:string1}": 1
  - http:
      id: bulk_invalid_value
      as: superadmin
      method: POST
      path: "/{sheet:s}/bulk/update"
      form:
        submit: 1
        "field{column:s:integer1}": notanumber
        "bulk_inc_{column:s:integer1}": 1
  - http:
      id: bulk_no_records
      as: superadmin
      method: POST
      path: "/{sheet:s}/bulk/update"
      query: { id: [99] }
      form:
        submit: 1
        "field{column:s:string1}": None
        "bulk_inc_{column:s:string1}": 1
  - db:
      id: currents_after
      op: select
      table: current
      columns: [id, instance_id]
      order_by: [id]
  - db:
      id: strings_after
      op: select
      table: string
      columns: [record_id, layout_id, value]
      order_by: [record_id, layout_id]
  - db:
      id: intgrs_after
      op: select
      table: intgr
      columns: [record_id, layout_id, value]
      order_by: [record_id, layout_id]
  - http: { id: data_after, as: superadmin, path: "/{sheet:s}/data" }
