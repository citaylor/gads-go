- set_time:
    time: '2014-10-01 14:00:00'
- record:
    op: update
    sheet: main
    current_id: 1
    values:
      string1: Foobar5
    options:
      no_alerts: 1
- view:
    op: create
    sheet: main
    as: created_asc
    name: Test view
    sorts:
    - name: _created
      type: asc
- held:
    id: first record sorting by created (asc)
    op: single
    as: first_asc
    sheet: main
    view_ref: created_asc
    expect:
      current_id: '1'
- view:
    op: create
    sheet: main
    as: created_desc
    name: Test view
    sorts:
    - name: _created
      type: desc
- held:
    id: first record sorting by created (desc)
    op: single
    as: first_desc
    sheet: main
    view_ref: created_desc
    expect:
      current_id: '203'
- view:
    op: create
    sheet: main
    as: by_created
    name: Test view
    filter:
      rules:
      - name: _created
        type: string
        operator: equal
        value: '2014-01-01 12:00:00'
- search:
    id: search by created time
    sheet: main
    view_ref: by_created
    expect:
      count: '1'
      ids:
      - '1'
