- view:
    op: create
    sheet: main
    as: created_asc
    name: Test view
    sorts:
    - name: _created_user
      type: asc
- held:
    id: first record sorting by created user (asc)
    op: single
    as: first_asc
    sheet: main
    view_ref: created_asc
    expect:
      current_id: '1'
- view:
    op: create
    sheet: main
    as: created_desc
    name: Test view
    sorts:
    - name: _created_user
      type: desc
- held:
    id: first record sorting by created user (desc)
    op: single
    as: first_desc
    sheet: main
    view_ref: created_desc
    expect:
      current_id: '202'
- view:
    op: create
    sheet: main
    as: by_user
    name: Test view
    filter:
      rules:
      - name: _created_user
        type: string
        operator: equal
        value: User1, User1
- search:
    id: search by created user
    sheet: main
    view_ref: by_user
    expect:
      count: '1'
      ids:
      - '1'
- db:
    op: update
    table: record
    set:
      createdby: null
- held:
    id: blank editor retrieved as group
    op: single
    as: g2
    sheet: main
    record_meta: true
    observe:
    - _created_user
    expect:
      meta:
        edited_user: ''
      values:
        _created_user: ''
- held:
    id: blank editor retrieved as single
    op: find
    as: s2
    current_id: '@held:g2'
    record_meta: true
    observe:
    - _created_user
    expect:
      meta:
        edited_user: ''
      values:
        _created_user: ''
